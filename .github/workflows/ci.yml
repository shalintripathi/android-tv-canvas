name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # A dry run of the release: builds and checks the signed APK and uploads it as an artifact, without a release.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}  # a release dry run never cancels a push build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test, lint and build
        run: ./gradlew --no-daemon test lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canvas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Check the signing secrets are set
        env:
          CANVAS_KEYSTORE_B64: ${{ secrets.CANVAS_KEYSTORE_B64 }}
          CANVAS_KEYSTORE_PASSWORD: ${{ secrets.CANVAS_KEYSTORE_PASSWORD }}
          CANVAS_KEY_ALIAS: ${{ secrets.CANVAS_KEY_ALIAS }}
          CANVAS_KEY_PASSWORD: ${{ secrets.CANVAS_KEY_PASSWORD }}
        run: |
          # Without them Gradle would quietly sign the release with the debug key. Only the names are printed.
          missing=""
          for name in CANVAS_KEYSTORE_B64 CANVAS_KEYSTORE_PASSWORD CANVAS_KEY_ALIAS CANVAS_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Release signing secret(s) not set:$missing"
            exit 1
          fi

      - name: Build the signed release APK
        env:
          CANVAS_KEYSTORE_B64: ${{ secrets.CANVAS_KEYSTORE_B64 }}
          CANVAS_KEYSTORE_PASSWORD: ${{ secrets.CANVAS_KEYSTORE_PASSWORD }}
          CANVAS_KEY_ALIAS: ${{ secrets.CANVAS_KEY_ALIAS }}
          CANVAS_KEY_PASSWORD: ${{ secrets.CANVAS_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dry-run-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          trap 'rm -f "$RUNNER_TEMP/release.p12"' EXIT
          printf '%s' "$CANVAS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export CANVAS_KEYSTORE="$RUNNER_TEMP/release.p12"
          # The release certificate's SHA-256, for the next step to look for in the APK. A certificate is public.
          cert="$(keytool -list -v -keystore "$CANVAS_KEYSTORE" -storepass:env CANVAS_KEYSTORE_PASSWORD -alias "$CANVAS_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          if [[ ! "$cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the release certificate's SHA-256 from the keystore"
            exit 1
          fi
          echo "RELEASE_CERT_SHA256=$cert" >> "$GITHUB_ENV"
          ./gradlew --no-daemon assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "canvas-$VERSION.apk"

      - name: Check the APK is signed with the release key
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$sdk" ] || [ ! -x "$apksigner" ]; then
            echo "::error::apksigner not found under \$ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using $apksigner ($("$apksigner" --version))"
          if [[ ! "${RELEASE_CERT_SHA256:-}" =~ ^[0-9a-f]{64}$ ]]; then  # an empty pattern would match anything
            echo "::error::The build step did not record the release certificate's SHA-256"
            exit 1
          fi
          # Look for the release certificate's own digest, not for apksigner's wording, which changes between
          # build-tools versions. The debug key has a different digest, so a debug-signed APK fails here too.
          if ! certs="$("$apksigner" verify --verbose --print-certs "canvas-$VERSION.apk" 2>&1)"; then
            echo "$certs"
            echo "::error::canvas-$VERSION.apk does not verify"
            exit 1
          fi
          if ! tr 'A-F' 'a-f' <<< "$certs" | grep -q -F "$RELEASE_CERT_SHA256"; then
            echo "$certs"
            echo "::error::canvas-$VERSION.apk is not signed with the release key (certificate SHA-256 $RELEASE_CERT_SHA256)"
            exit 1
          fi
          echo "canvas-$VERSION.apk is signed with the release key (certificate SHA-256 $RELEASE_CERT_SHA256)"

      - name: Upload the signed APK (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canvas-release-apk
          path: canvas-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Release
        if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" "canvas-$VERSION.apk" --title "Canvas $VERSION" --generate-notes
